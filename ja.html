
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>計算比較課題</title>

  <!-- Favicon -->
  <link rel="icon" href="data:,">

  <!-- CSS -->
  <link rel="stylesheet"
        href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <link rel="stylesheet" href="css/style.css">

  <!-- jsPsych 7 -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>

  <!-- jsPsych Plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>

  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
</head>

<body>

  <!-- 实验配置 -->
  <script src="js/config.js"></script>

  <!-- 计算题生成器 -->
  <script src="js/generator.js"></script>

  <!-- 数据保存 -->
  <script src="js/storage.js"></script>

  <!-- 实验主程序 -->
  <script src="js/app.js"></script>

  <script>
    // 动态加载 JavaScript 文件
    function loadScript(url) {
      return new Promise(function(resolve, reject) {
        var script = document.createElement('script');
        script.src = url;

        script.onload = resolve;

        script.onerror = function() {
          script.remove();
          reject(new Error('Failed to load ' + url));
        };

        document.head.appendChild(script);
      });
    }

    // 加载 survey-likert 插件并启动日语版
    (async function() {

      // 两个备用 CDN 地址
      var urls = [
        'https://cdn.jsdelivr.net/npm/@jspsych/plugin-survey-likert@1.1.3/dist/index.browser.min.js',
        'https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3/dist/index.browser.min.js'
      ];

      for (
        var i = 0;
        i < urls.length &&
        typeof window.jsPsychSurveyLikert === 'undefined';
        i++
      ) {
        try {
          await loadScript(urls[i]);
        } catch (error) {
          console.warn(error.message);
        }
      }

      // 检查所有必要组件
      var globals = [
        'initJsPsych',
        'jsPsychHtmlButtonResponse',
        'jsPsychHtmlKeyboardResponse',
        'jsPsychSurveyLikert',
        'startComet'
      ];

      var missing = globals.filter(function(key) {
        return typeof window[key] === 'undefined';
      });

      // 如果组件加载失败，显示错误提示
      if (missing.length) {
        console.error('Missing dependencies:', missing);

        document.body.innerHTML =
          '<main style="max-width:680px;margin:12vh auto;' +
          'font:16px/1.7 sans-serif;padding:24px">' +
          '<h2>実験を開始できません</h2>' +
          '<p>一部の実験ライブラリを読み込めませんでした。' +
          'ネットワーク接続を確認し、' +
          'ページを再読み込みしてください。</p>' +
          '<pre>' + missing.join(', ') + '</pre></main>';

        return;
      }

      // 启动日语版实验
      window.startComet('ja');

    })();
  </script>

</body>
</html>
